name: Refresh deployment (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Trigger Vercel deploy hook
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not configured; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"
          echo "Deployment hook triggered."
