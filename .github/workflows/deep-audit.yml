name: Deep code audit

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-code-audit
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  prepare:
    name: Prepare audit chunks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare chunks
        run: pnpm deep:prepare --output deep-audit-chunks.json

      - name: Build matrix
        id: matrix
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const data = require("./deep-audit-chunks.json");
          console.log(`matrix=${JSON.stringify({ include: data.chunks.map((chunk) => ({ chunk: chunk.index })) })}`);
          NODE

      - name: Upload chunks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deep-audit-chunks
          path: deep-audit-chunks.json
          retention-days: 1

  analyze:
    name: Analyze chunk ${{ matrix.chunk }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable

      - name: Install static analyzers
        run: |
          python -m venv "$HOME/.venvs/deep-audit"
          "$HOME/.venvs/deep-audit/bin/pip" install "lizard==1.25.1" "ruff==0.17.4"
          echo "$HOME/.venvs/deep-audit/bin" >> "$GITHUB_PATH"
          npm install --global --ignore-scripts jscpd@5.4.2 oxlint@1.92.0
          sudo apt-get update
          sudo apt-get install --yes cppcheck || true
          go install github.com/gitleaks/gitleaks/v8@v8.30.1 || true # NOSONAR(githubactions:S8545)
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0 || true # NOSONAR(githubactions:S8545)
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download chunks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: deep-audit-chunks

      - name: Analyze repositories
        run: >-
          pnpm deep:analyze
          --chunks deep-audit-chunks.json
          --chunk ${{ matrix.chunk }}
          --output artifacts/code-quality-chunk-${{ matrix.chunk }}.json

      - name: Upload chunk result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: code-quality-chunk-${{ matrix.chunk }}
          path: artifacts/code-quality-chunk-${{ matrix.chunk }}.json
          if-no-files-found: error
          retention-days: 7

  merge:
    name: Merge results and deploy
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: code-quality-chunk-*
          path: artifacts
          merge-multiple: true

      - name: Merge results
        run: pnpm deep:merge --inputs artifacts --output src/generated/repository-code-quality.json

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/repository-code-quality.json
          if git diff --cached --quiet; then
            echo "No code quality changes to commit."
          else
            git commit -m "chore: refresh deep code quality"
            git push
          fi

      - name: Trigger deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not configured; skipping deployment trigger."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"
          echo "Deployment hook triggered."
